services:
  mongodb:
    image: mongo:latest
    container_name: feedants_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: feedants_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/feedants_competition
      - NODE_ENV=production
    depends_on:
      - mongodb

volumes:
  mongo_data:
